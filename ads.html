<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dexogram Ads</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0e14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .loading-ads {
            color: #00ffff;
            font-size: 18px;
        }
    </style>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>
<body>

    <div id="adStatus" class="loading-ads">Loading advertisement...</div>

    <script>
        // Adsgram Block ID ingizni shu yerga yozasiz
        const AdController = window.Adsgram.init({ blockId: "int-34600" });

        // Sahifa yuklanishi bilan reklamani ko'rsatish
        window.onload = function() {
            AdController.show().then((result) => {
                // Reklama muvaffaqiyatli ko'rsatildi
                document.getElementById("adStatus").innerText = "Scroll to the next video ⬇️";
            }).catch((result) => {
                // Reklama yuklanishda xatolik bo'lsa
                document.getElementById("adStatus").innerText = "Ad failed to load. Scroll to continue. ⬇️";
                console.error("Adsgram xatolik:", result);
            });
        };
    </script>
</body>
</html>
