<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dexogram - Statistika</title>
    <link rel="stylesheet" href="statistics.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <header class="header">
        <a href="settings.html" class="back-btn">← Orqaga</a>
        <h1 class="logo">STATISTIKA</h1>
    </header>

    <main class="stat-container">

        <!-- Umumiy statistika kartlari -->
        <div class="overview-cards">
            <div class="ov-card">
                <div class="ov-icon">🎬</div>
                <div class="ov-num" id="totalVideos">—</div>
                <div class="ov-label">Videolar</div>
            </div>
            <div class="ov-card">
                <div class="ov-icon">❤️</div>
                <div class="ov-num" id="totalLikes">—</div>
                <div class="ov-label">Layklar</div>
            </div>
            <div class="ov-card">
                <div class="ov-icon">💬</div>
                <div class="ov-num" id="totalComments">—</div>
                <div class="ov-label">Sharhlar</div>
            </div>
            <div class="ov-card">
                <div class="ov-icon">👁️</div>
                <div class="ov-num" id="totalViews">—</div>
                <div class="ov-label">Ko'rishlar</div>
            </div>
        </div>

        <!-- Grafik bo'limi -->
        <div class="chart-card">
            <div class="chart-header">
                <div class="chart-title">Oxirgi 28 kunlik faollik</div>
                <div class="chart-tabs">
                    <button class="tab-btn active" data-metric="likes">Layk</button>
                    <button class="tab-btn" data-metric="comments">Sharh</button>
                    <button class="tab-btn" data-metric="views">Ko'rish</button>
                </div>
            </div>
            <div class="chart-wrap">
                <canvas id="statChart"></canvas>
                <div class="chart-loading" id="chartLoading">Yuklanmoqda...</div>
            </div>
            <div class="chart-dates" id="chartDates"></div>
        </div>

        <!-- Video ro'yxati -->
        <div class="videos-stats-section">
            <div class="section-title">Videolar bo'yicha</div>
            <div id="videoStatsList">
                <div class="loading-text">Yuklanmoqda...</div>
            </div>
        </div>

    </main>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="search.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <span>Qidirish</span>
        </a>
        <a href="create.html" class="nav-item upload-btn">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <span>Post</span>
        </a>
        <a href="reels.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg>
            <span>Reels</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            <span>Profil</span>
        </a>
    </nav>

    <script type="module" src="statistics.js"></script>
</body>
</html>
