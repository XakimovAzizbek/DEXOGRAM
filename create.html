<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DexoGram - Create</title>
    <link rel="stylesheet" href="create.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head>
<body>

    <header class="app-header">
        <div class="back-btn" onclick="window.location.href='home.html'">
            <i class="fa-solid fa-arrow-left"></i>
        </div>
        <div class="page-title">Yangi Reels ulashish</div>
        <div style="width: 24px;"></div> 
    </header>

    <main class="create-container">
        
        <div class="input-section">
            <label for="youtubeLinkInput" class="section-label">
                <i class="fa-brands fa-youtube" style="color: #ff0000;"></i> YouTube Video yoki Shorts Havolasi:
            </label>
            <input type="text" id="youtubeLinkInput" placeholder="https://youtube.com/shorts/... yoki https://youtu.be/..." autocomplete="off">
            <p class="error-message" id="linkError">Havola xato! Iltimos, to'g'ri YouTube havolasini kiriting.</p>
        </div>

        <div class="preview-section" id="previewSection" style="display: none;">
            <p class="section-label"><i class="fa-solid fa-eye"></i> Oldindan ko'rish:</p>
            <div class="video-preview-wrapper">
                <iframe id="youtubePreviewFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>

        <div class="caption-section">
            <label for="captionInput" class="section-label"><i class="fa-solid fa-pen-nib"></i> Video tavsifi (Caption):</label>
            <textarea id="captionInput" placeholder="Video haqida biror narsa yozing... #dexogram #reels #trend" rows="4"></textarea>
        </div>

        <div class="loader-container" id="loaderContainer" style="display: none;">
            <div class="spinner"></div>
            <p id="progressText">Ma'lumotlar Firebase-ga yozilmoqda...</p>
        </div>

        <button class="share-btn" id="shareBtn" disabled>Postni ulashish (Share)</button>
    </main>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="search.html" class="nav-item">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </a>
        <a href="create.html" class="nav-item active">
            <i class="fa-regular fa-square-plus"></i>
            <span>Create</span>
        </a>
        <a href="reels.html" class="nav-item">
            <i class="fa-solid fa-clapperboard"></i>
            <span>Reels</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fa-regular fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <script type="module" src="create.js"></script>
</body>
</html>
